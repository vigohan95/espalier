[package]
name = "espalier-registry"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared recipient denylist with evidence-backed reports for NEAR agents"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
