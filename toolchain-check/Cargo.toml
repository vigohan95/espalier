[package]
name = "hello-check"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
near-workspaces = "0.24.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
