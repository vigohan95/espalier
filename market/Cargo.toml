[package]
name = "espalier-market"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Sealed-bid subcontracting market where the prize is a grant in an Espalier vault"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
serde_json = "1"
